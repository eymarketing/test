<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Hiragino Sans',sans-serif;background:#1a1a1a;color:#e8e8e8;height:100vh;display:flex;flex-direction:column;overflow:hidden;font-size:13px}
.topbar{background:#111;border-bottom:1px solid #333;padding:0 16px;display:flex;align-items:center;gap:12px;height:48px;flex-shrink:0}
.logo{font-size:15px;font-weight:700;color:#fff;margin-right:8px}.logo span{color:#e05a00}
.tab-group{display:flex;gap:6px}
.tab{padding:6px 16px;border-radius:20px;font-size:12px;cursor:pointer;border:none;font-weight:500;transition:all .15s}
.tab.active{background:#e05a00;color:#fff}
.tab.inactive{background:#2a2a2a;color:#aaa;border:1px solid #444}
.chip-bar{display:flex;gap:5px;flex:1;flex-wrap:wrap;align-items:center;overflow:hidden;min-width:0}
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:12px;padding:3px 8px;font-size:11px;white-space:nowrap}
.chip-l1{background:#1e3a20;color:#5cb85c}.chip-l2{background:#1e2e4a;color:#7ab8f5}
.chip-l3{background:#2e1e4a;color:#b07af5}.chip-l4{background:#4a2e1e;color:#f5a07a}
.chip-l5{background:#1e3a38;color:#7af5e8}
.chip-adhoc{background:#3a2800;color:#f5a050}.chip-always{background:#0a2a20;color:#5dcaa5}
.chip-x{cursor:pointer;font-size:14px;line-height:1;background:none;border:none;padding:0 0 0 2px;opacity:.7}
.chip-x:hover{opacity:1}
.fy-group{display:flex;gap:6px;margin-left:auto;flex-shrink:0}
.fy-btn{padding:4px 10px;border-radius:4px;font-size:11px;border:1px solid #444;background:#1a1a1a;color:#ccc;cursor:pointer}
.fy-btn.active{background:#185FA5;color:#fff;border-color:#185FA5}
.layout{display:flex;flex:1;overflow:hidden}
.sidebar{width:224px;min-width:224px;background:#161616;border-right:1px solid #2a2a2a;display:flex;flex-direction:column;overflow-y:auto}
.sidebar::-webkit-scrollbar{width:4px}.sidebar::-webkit-scrollbar-thumb{background:#333;border-radius:2px}
.sb-header{padding:10px 14px;border-bottom:1px solid #2a2a2a}
.sb-title{font-size:12px;font-weight:600;color:#ccc;display:flex;justify-content:space-between;align-items:center}
.sb-sub{font-size:10px;color:#555;margin-top:2px}
.sb-clear{font-size:10px;color:#7ab8f5;cursor:pointer;background:none;border:none;padding:0}
.sb-section{border-bottom:1px solid #222}
.sb-section-hd{display:flex;align-items:center;justify-content:space-between;padding:8px 10px;cursor:pointer;user-select:none}
.sb-section-hd:hover{background:#1d1d1d}
.sb-items{padding:0 10px 8px;overflow:hidden}
.sb-items.collapsed{display:none}
.sb-lbl{display:flex;align-items:center;gap:5px;font-size:11px;color:#999;font-weight:600}
.sb-chevron{font-size:10px;color:#555;transition:transform .2s;line-height:1}
.sb-chevron.open{transform:rotate(0deg)}
.sb-chevron.closed{transform:rotate(-90deg)}
.lbadge{font-size:9px;font-weight:700;width:18px;height:14px;border-radius:2px;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.l1b{background:#1e3a20;color:#5cb85c}.l2b{background:#1e2e4a;color:#7ab8f5}
.l3b{background:#2e1e4a;color:#b07af5}.l4b{background:#4a2e1e;color:#f5a07a}
.l5b{background:#1e3a38;color:#7af5e8}
.adhocb{background:#3a2800;color:#f5a050}.alwaysb{background:#0a2a20;color:#5dcaa5}
.sel-badge{font-size:9px;background:#e05a00;color:#fff;border-radius:8px;padding:1px 5px}
.fi{display:flex;align-items:center;gap:6px;padding:3px 4px;cursor:pointer;border-radius:3px;user-select:none}
.fi:hover{background:#222}
.fi input{width:13px;height:13px;cursor:pointer;accent-color:#e05a00;flex-shrink:0}
.fi-name{flex:1;font-size:12px;color:#bbb}.fi-name.on{color:#e05a00}
.fi-val{font-size:10px;color:#555}
.fi-tag{font-size:9px;padding:1px 4px;border-radius:2px;margin-left:2px}
.fi-tag-adhoc{background:#3a2800;color:#f5a050}
.fi-tag-always{background:#0a2a20;color:#5dcaa5}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.result-bar{padding:8px 16px;border-bottom:1px solid #2a2a2a;display:flex;align-items:center;gap:8px;flex-shrink:0;background:#161616}
.result-text{font-size:11px;color:#777}
.result-badge{background:#1e2e4a;color:#7ab8f5;border-radius:4px;padding:2px 8px;font-size:11px}
.content{flex:1;overflow-y:auto;padding:12px}
.content::-webkit-scrollbar{width:4px}.content::-webkit-scrollbar-thumb{background:#333;border-radius:2px}
/* KPI */
.kpi-row{display:grid;grid-template-columns:repeat(6,1fr);gap:7px;margin-bottom:10px}
.kpi{background:#1e1e1e;border:1px solid #2a2a2a;border-radius:6px;padding:10px 12px;position:relative;overflow:hidden}
.kpi.gp{border-color:#2a3a20}
.kpi-lbl{font-size:9px;color:#555;letter-spacing:.07em;text-transform:uppercase;margin-bottom:3px}
.kpi-val{font-size:19px;font-weight:600;line-height:1.15}
.kpi-sub{font-size:10px;color:#555;margin-top:3px}
.kb{display:inline-flex;align-items:center;font-size:9px;padding:2px 5px;border-radius:2px;font-weight:600}
.kup{background:#1a3220;color:#5cb85c}.kdn{background:#3a1a1a;color:#e05a00}
.kline{position:absolute;bottom:0;left:0;right:0;height:2px}
.klg{background:#2d6e4e}.klr{background:#7B2D2D}.klb{background:#185FA5}.klgp{background:#5cb85c}
/* cost breakdown bar */
.cost-breakdown{margin-bottom:10px}
.cb-bar{display:flex;height:8px;border-radius:4px;overflow:hidden;margin:4px 0}
.cb-seg-campaign{background:#185FA5}
.cb-seg-adhoc{background:#f5a050}
.cb-seg-always{background:#5dcaa5}
.cb-legend{display:flex;gap:12px;font-size:10px;color:#777}
.cb-dot{width:8px;height:8px;border-radius:2px;display:inline-block;margin-right:3px}
/* grid */
.mid-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.bot-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{background:#1e1e1e;border:1px solid #2a2a2a;border-radius:6px;padding:12px 14px}
.card-hd{font-size:11px;font-weight:600;color:#ccc;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
.card-hd-sub{font-size:10px;color:#555;font-weight:400}
table{width:100%;border-collapse:collapse;font-size:11px}
th{text-align:right;color:#555;font-weight:500;font-size:9px;padding:4px 6px;border-bottom:1px solid #282828;letter-spacing:.04em;text-transform:uppercase}
th:first-child{text-align:left}
td{padding:5px 6px;text-align:right;color:#bbb;border-bottom:1px solid #1d1d1d}
td:first-child{text-align:left;color:#ddd}
tr.total-row td{font-weight:600;color:#e8e8e8;border-top:1px solid #333;border-bottom:none}
tr.adhoc-row td:first-child{color:#f5a050}
tr.always-row td:first-child{color:#5dcaa5}
.roib{display:inline-block;background:#2a1a05;color:#f5a050;border-radius:2px;padding:1px 4px;font-size:10px;font-weight:600}
.gpb{display:inline-block;background:#1a3220;color:#5cb85c;border-radius:2px;padding:1px 4px;font-size:10px;font-weight:600}
/* funnel */
.funnel-wrap{display:flex;flex-direction:column;gap:8px}
.funnel-bars{display:flex;align-items:flex-end;gap:6px;height:100px}
.fb-wrap{display:flex;flex-direction:column;align-items:center;gap:3px;flex:1}
.fb{border-radius:2px 2px 0 0;width:100%}
.fn{font-size:13px;font-weight:600;color:#e8e8e8}
.fl{font-size:9px;color:#555}.fp{font-size:9px;color:#444}
.conv-row{display:flex;justify-content:space-around;padding:8px 0 0;border-top:1px solid #252525}
.conv-item{text-align:center}
.cv{font-size:16px;font-weight:600;color:#7ab8f5}.cv.org{color:#f5a050}
.cvl{font-size:9px;color:#555}
.chart-legend{display:flex;gap:14px;margin-bottom:8px;flex-wrap:wrap}
.cleg{display:flex;align-items:center;gap:4px;font-size:10px;color:#777}
.cleg-sq{width:10px;height:10px;border-radius:1px;flex-shrink:0}
/* compare */
.cmp-table{width:100%;border-collapse:collapse;font-size:11px}
.cmp-table th{padding:7px 10px;text-align:right;color:#555;font-size:9px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;border-bottom:1px solid #282828}
.cmp-table th:first-child{text-align:left;width:100px}
.cmp-table td{padding:7px 10px;text-align:right;color:#bbb;border-bottom:1px solid #1d1d1d}
.cmp-table td:first-child{text-align:left;color:#666;font-size:9px;letter-spacing:.06em;text-transform:uppercase}
.cmp-best{color:#f5a050;font-weight:700}
.cmp-col-name{font-size:10px;font-weight:700;color:#e8e8e8;letter-spacing:.04em;text-transform:uppercase}
/* info tooltip */
.info-note{font-size:10px;color:#555;font-style:italic;margin-top:4px}
</style>

const fmtM=v=>v===undefined||v===0?'-':(v>=1?'¥'+Math.round(v)+'M':'¥'+Math.round(v*10)/10+'M');

function setMode(m){

function clearAll(){
  [...LEVELS,'ADHOC','ALWAYS'].forEach(l=>selected[l].clear());
  render();

function toggle(level,id){
  if(selected[level].has(id))selected[level].delete(id);
  else selected[level].add(id);
  render();
}
function toggleCollapse(level){
  collapsed[level]=!collapsed[level];
  renderSidebar();
}

function getAll(){
  let all=[];
  LEVELS.forEach(l=>selected[l].forEach(id=>{
    const item=DATA[l].find(x=>x.id===id);
    if(item)all.push({level:l,item,type:'campaign'});
  }));
  selected.ADHOC.forEach(id=>{
    const item=DATA.ADHOC.find(x=>x.id===id);
    if(item)all.push({level:'ADHOC',item,type:'adhoc'});
  });
  selected.ALWAYS.forEach(id=>{
    const item=DATA.ALWAYS.find(x=>x.id===id);
    if(item)all.push({level:'ALWAYS',item,type:'always'});
  });
  return all;
}

// L2の粗利率を取得（上位から辿る）
function getGpRate(item,level){
  if(level==='L2') return item.gp_rate||0.5;
  if(level==='L1'){
    const children=DATA.L2.filter(x=>x.p===item.id);
    if(!children.length) return 0.5;
    const wavg=children.reduce((s,c)=>s+c.revenue*(c.gp_rate||0.5),0)/children.reduce((s,c)=>s+c.revenue,0);
    return wavg;
  }
  // L3以下：親L2を辿る
  const findParentGp=(id,lv)=>{
    const lvIdx=LEVELS.indexOf(lv);
    if(lvIdx<=1) return DATA.L2.find(x=>x.id===id)?.gp_rate||0.5;
    const parentLv=LEVELS[lvIdx-1];
    const cur=DATA[lv].find(x=>x.id===id);
    if(!cur) return 0.5;
    return findParentGp(cur.p,parentLv);
  };
  return findParentGp(item.id,level);
}

function sum(items){
  if(!items.length)return null;
  const t={revenue:0,pipeline:0,cost:0,mql:0,sql:0,leads:0,gp:0,
    costCampaign:0,costAdhoc:0,costAlways:0};
  items.forEach(({level,item,type})=>{
    t.revenue+=item.revenue; t.pipeline+=item.pipeline; t.cost+=item.cost;
    t.mql+=item.mql; t.sql+=item.sql; t.leads+=item.leads;
    const gpr=type==='campaign'?getGpRate(item,level):0;
    t.gp+=item.revenue*gpr;
    if(type==='campaign') t.costCampaign+=item.cost;
    else if(type==='adhoc') t.costAdhoc+=item.cost;
    else t.costAlways+=item.cost;
  });
  t.roi=t.cost>0?t.revenue/t.cost:0;
  t.gp_roi=t.cost>0?t.gp/t.cost:0;
  t.cpl=t.leads>0?t.cost*1000/t.leads:0;
  return t;
}

    if(!campaignItems.length) return;
    const labels=campaignItems.map(({item})=>item.name.length>11?item.name.slice(0,11)+'…':item.name);
    charts.bar=new Chart(document.getElementById('barChart'),{
      type:'bar',
      data:{labels,datasets:[
        {label:'Revenue',data:campaignItems.map(x=>x.item.revenue),backgroundColor:'#2d6e4e',barThickness:barThick},
        {label:'Cost',data:campaignItems.map(x=>x.item.cost),backgroundColor:'#8B3A1E',barThickness:barThick},
        {label:'Pipeline×0.15',data:campaignItems.map(x=>+(x.item.pipeline*.15).toFixed(1)),backgroundColor:'rgba(53,130,220,0.3)',barThickness:barThick}
      ]},
      options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},
        scales:{x:{grid:{display:false},ticks:{color:'#666',font:{size:9}}},y:{grid:{color:'rgba(255,255,255,0.04)'},ticks:{color:'#666',font:{size:9},callback:v=>'¥'+v+'M'}}}}
    });
    const sorted=[...campaignItems].sort((a,b)=>{
      const gpA=a.item.revenue*getGpRate(a.item,a.level)/a.item.cost;
      const gpB=b.item.revenue*getGpRate(b.item,b.level)/b.item.cost;
      return gpB-gpA;
    });
    charts.roi=new Chart(document.getElementById('roiChart'),{
      type:'bar',
      data:{
        labels:sorted.map(x=>x.item.name.length>13?x.item.name.slice(0,13)+'…':x.item.name),
        datasets:[{data:sorted.map(x=>+(x.item.revenue*getGpRate(x.item,x.level)/x.item.cost).toFixed(2)),backgroundColor:'#2d6e4e',borderRadius:2,barThickness:Math.max(barThick,12)}]
      },
      options:{indexAxis:'y',responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},
        scales:{x:{min:0,grid:{color:'rgba(255,255,255,0.04)'},ticks:{color:'#666',font:{size:9},callback:v=>v+'x'}},y:{grid:{display:false},ticks:{color:'#999',font:{size:9}}}}}
    });
  },50);
}

function renderCompare(all){
  const mc=document.getElementById('mainContent');
  const campaignItems=all.filter(x=>x.type==='campaign');
  if(!campaignItems.length){mc.innerHTML='<div style="padding:48px;text-align:center;color:#444">比較にはCampaign-driven項目を選択してください</div>';return;}

  const metrics=['revenue','pipeline','cost','roi','gp_roi','mql','sql','cpl','leads'];
  const bests={};
  const bestFn={revenue:Math.max,pipeline:Math.max,cost:Math.min,roi:Math.max,gp_roi:Math.max,mql:Math.max,sql:Math.max,cpl:Math.min,leads:Math.max};
  const enriched=campaignItems.map(({level,item})=>({level,item,gp_roi:item.revenue*getGpRate(item,level)/item.cost}));
  metrics.forEach(m=>{
    const vals=enriched.map(x=>m==='gp_roi'?x.gp_roi:x.item[m]);
    bests[m]=bestFn[m](...vals);
  });
  const mLabel={revenue:'REVENUE',pipeline:'PIPELINE',cost:'COST',roi:'ROI',gp_roi:'GP-ROI',mql:'MQL',sql:'SQL',cpl:'CPL',leads:'LEADS'};
  const mFmt={revenue:fmtM,pipeline:fmtM,cost:fmtM,roi:fmtX,gp_roi:fmtX,mql:v=>Math.round(v),sql:v=>Math.round(v),cpl:fmtK,leads:v=>Math.round(v)};

  const colHds=enriched.map(({level,item})=>`<th style="text-align:right;min-width:110px">
    <span class="lbadge ${level==='L1'?'l1b':level==='L2'?'l2b':level==='L3'?'l3b':level==='L4'?'l4b':'l5b'}">${level}</span><br>
    <span class="cmp-col-name">${item.name.toUpperCase()}</span>
  </th>`).join('');

  const rows=metrics.map(m=>`<tr><td>${mLabel[m]}</td>${enriched.map(x=>{
    const v=m==='gp_roi'?x.gp_roi:x.item[m];
    const best=(v===bests[m]);
    return `<td class="${best?'cmp-best':''}">${mFmt[m](v)}</td>`;
  }).join('')}</tr>`).join('');

  const cmpTable=`<div class="card" style="margin-bottom:10px">
    <div class="card-hd">全指標 横断比較テーブル <span class="card-hd-sub">太字・オレンジ = 最良値 ｜ GP-ROI = 粗利ベース（ダミー値）</span></div>
    <table class="cmp-table"><thead><tr><th>指標</th>${colHds}</tr></thead><tbody>${rows}</tbody></table>
  </div>`;

  const radar=`<div class="card"><div class="card-hd">レーダーチャート <span class="card-hd-sub">GP-ROI含む7指標を正規化して比較</span></div><div style="position:relative;width:100%;height:240px"><canvas id="radarChart"></canvas></div></div>`;
  const scatter=`<div class="card"><div class="card-hd">GP-ROI vs CPL 散布図 <span class="card-hd-sub">右上（高GP-ROI・低CPL）が最良</span></div><div style="position:relative;width:100%;height:240px"><canvas id="scatterChart"></canvas></div></div>`;

  mc.innerHTML=cmpTable+`<div class="bot-row">${radar}${scatter}</div>`;

  destroyCharts();
  setTimeout(()=>{
    const colors=['#185FA5','#3B6D11','#D85A30','#534AB7','#B07A00','#1e7a7a','#9B3080'];
    const norm=arr=>{const mx=Math.max(...arr),mn=Math.min(...arr);return arr.map(v=>mx===mn?.5:(v-mn)/(mx-mn));};
    const nRev=norm(enriched.map(x=>x.item.revenue));
    const nPip=norm(enriched.map(x=>x.item.pipeline));
    const nCPL=norm(enriched.map(x=>1/x.item.cpl));
    const nROI=norm(enriched.map(x=>x.item.roi));
    const nGP=norm(enriched.map(x=>x.gp_roi));
    const nLead=norm(enriched.map(x=>x.item.leads));
    const nMQL=norm(enriched.map(x=>x.item.mql));

    charts.radar=new Chart(document.getElementById('radarChart'),{
      type:'radar',
      data:{labels:['Revenue','Pipeline','CPL効率','ROI','GP-ROI','Leads','MQL'],
        datasets:enriched.map(({item},i)=>({
          label:item.name,
          data:[nRev[i],nPip[i],nCPL[i],nROI[i],nGP[i],nLead[i],nMQL[i]],
          borderColor:colors[i%colors.length],backgroundColor:colors[i%colors.length]+'18',
          pointBackgroundColor:colors[i%colors.length],borderWidth:1.5,pointRadius:4
        }))},
      options:{responsive:true,maintainAspectRatio:false,
        plugins:{legend:{position:'bottom',labels:{color:'#888',font:{size:10},boxWidth:10,padding:10}}},
        scales:{r:{grid:{color:'rgba(255,255,255,0.07)'},angleLines:{color:'rgba(255,255,255,0.07)'},ticks:{display:false},pointLabels:{color:'#777',font:{size:10}}}}}
    });
    charts.scatter=new Chart(document.getElementById('scatterChart'),{
      type:'scatter',
      data:{datasets:enriched.map(({item,gp_roi},i)=>({
        label:item.name,data:[{x:item.cpl,y:gp_roi}],
        backgroundColor:colors[i%colors.length],pointRadius:9,pointHoverRadius:11
      }))},
      options:{responsive:true,maintainAspectRatio:false,
        plugins:{legend:{position:'bottom',labels:{color:'#888',font:{size:10},boxWidth:10,padding:10}},
          tooltip:{callbacks:{label:ctx=>`${ctx.dataset.label}: GP-ROI ${ctx.parsed.y.toFixed(1)}x / CPL ¥${Math.round(ctx.parsed.x)}K`}}},
        scales:{
          x:{grid:{color:'rgba(255,255,255,0.05)'},ticks:{color:'#666',font:{size:9},callback:v=>'¥'+v+'K'},title:{display:true,text:'CPL (¥K)',color:'#555',font:{size:9}}},
          y:{grid:{color:'rgba(255,255,255,0.05)'},ticks:{color:'#666',font:{size:9},callback:v=>v+'x'},title:{display:true,text:'GP-ROI',color:'#555',font:{size:9}}}
        }}
    });
  },50);
}

function destroyCharts(){Object.values(charts).forEach(c=>{try{c.destroy()}catch(e){}});charts={};}
render();
</script>
</body>
</html>
